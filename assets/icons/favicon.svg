<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#27121a" />
      <stop offset="60%" stop-color="#111115" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Fondo oscuro redondeado -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-glow)" stroke="#27272a" stroke-width="14" />

  <!-- Botón superior del cronómetro (corona) -->
  <line x1="204" y1="88" x2="308" y2="88" stroke="#fb7185" stroke-width="26" stroke-linecap="round" />
  <line x1="256" y1="88" x2="256" y2="132" stroke="#f43f5e" stroke-width="24" stroke-linecap="round" />

  <!-- Anillo base del cronómetro -->
  <circle cx="256" cy="280" r="144" fill="#18181b" stroke="#27272a" stroke-width="28" />

  <!-- Arco de progreso Pomodoro (~75%) -->
  <circle
    cx="256"
    cy="280"
    r="144"
    fill="none"
    stroke="url(#ring-grad)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-dasharray="678 905"
    transform="rotate(-90 256 280)"
  />

  <!-- Manecillas del reloj -->
  <line x1="256" y1="280" x2="256" y2="196" stroke="#fafafa" stroke-width="24" stroke-linecap="round" />
  <line x1="256" y1="280" x2="314" y2="314" stroke="#fb7185" stroke-width="24" stroke-linecap="round" />
  <circle cx="256" cy="280" r="18" fill="#fafafa" />
</svg>
